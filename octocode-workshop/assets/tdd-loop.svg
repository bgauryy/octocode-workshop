<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" role="img" aria-label="TDD loop: red, write a failing test; green, make it pass; refactor, clean up; the agent runs the tests at every step">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f9cc4"/>
    </marker>
  </defs>
  <path d="M 300 92 A 170 170 0 0 1 418 330" fill="none" stroke="#7f9cc4" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 345 398 A 170 170 0 0 1 175 398" fill="none" stroke="#7f9cc4" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 102 330 A 170 170 0 0 1 220 92" fill="none" stroke="#7f9cc4" stroke-width="3" marker-end="url(#ar)"/>
  <circle cx="260" cy="250" r="78" fill="#0f1d35" stroke="#2c4778" stroke-width="2"/>
  <text x="260" y="242" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" fill="#5cd0ec">agent</text>
  <text x="260" y="270" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="20" fill="#5cd0ec">runs tests</text>
  <rect x="170" y="20" width="180" height="84" rx="14" fill="#142847" stroke="#f08585" stroke-width="3"/>
  <text x="260" y="56" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" fill="#f08585">RED</text>
  <text x="260" y="86" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#e3ecf7">failing test first</text>
  <rect x="340" y="330" width="170" height="84" rx="14" fill="#142847" stroke="#6ee7a7" stroke-width="3"/>
  <text x="425" y="366" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" fill="#6ee7a7">GREEN</text>
  <text x="425" y="396" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#e3ecf7">make it pass</text>
  <rect x="10" y="330" width="170" height="84" rx="14" fill="#142847" stroke="#5cd0ec" stroke-width="3"/>
  <text x="95" y="366" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" fill="#5cd0ec">REFACTOR</text>
  <text x="95" y="396" text-anchor="middle" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" fill="#e3ecf7">clean, stay green</text>
</svg>