  <ellipse cx="324" cy="272" rx="17" ry="9" fill="#f08585" opacity="0.45"/>
  <path d="M212 262 C228 276 254 274 272 254" fill="none" stroke="#050d1c" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M268 250 q10 2 10 12" fill="none" stroke="#050d1c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- hood collar -->
  <path d="M156 288 C190 318 220 328 240 330 C260 328 290 318 324 288 C338 302 342 320 338 334 C300 354 270 362 240 364 C210 362 180 354 142 334 C138 320 142 302 156 288 Z" fill="#c98e58" stroke="#050d1c" stroke-width="6" stroke-linejoin="round"/>
