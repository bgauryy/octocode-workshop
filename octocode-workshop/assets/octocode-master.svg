<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-label="A purple cartoon Octocode octopus dressed as a tiny Jedi master: big droopy ears, one raised eyebrow and a smug half-closed eye behind slipping round glasses, a beige robe, a coffee mug in one tentacle and a glowing staff in another">
  <defs>
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" gradientUnits="userSpaceOnUse" cx="200" cy="120" r="240">
      <stop offset="0%" stop-color="#ddd0ff"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8466ee"/>
    </radialGradient>
    <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="210" cy="150" r="200">
      <stop offset="60%" stop-color="#050d1c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050d1c" stop-opacity="0.32"/>
