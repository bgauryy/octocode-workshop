    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a6e8f2"/>
      <stop offset="100%" stop-color="#5cd0ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

